[preset.0]

name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,docs/attribution.md"
exclude_filter="test/*,generated_images/*,build/*"
export_path="build/macos/Guildbound.zip"

[preset.0.options]

binary_format/architecture="universal"
application/bundle_identifier="com.guildbound.game"
application/short_version="0.1.0"
application/version="0.1.0"
codesign/codesign=1
notarization/notarization=0

[preset.1]

name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,docs/attribution.md"
exclude_filter="test/*,generated_images/*,build/*"
export_path="build/linux/Guildbound.x86_64"

[preset.1.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=true

[preset.2]

name="Windows"
platform="Windows Desktop"
runnable=true
